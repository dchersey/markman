name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build and test native viewer
        run: ./scripts/test.sh
      - name: Check shell syntax
        run: bash -n bin/markman scripts/*.sh
