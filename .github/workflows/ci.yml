name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK and WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-webkit-6.0 xvfb xauth desktop-file-utils
      - name: Test Linux viewer
        # Ubuntu's runner policy otherwise prevents WebKit's bubblewrap sandbox.
        # Permit user namespaces on this disposable VM; keep WebKit sandboxed.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          dbus-run-session -- bash scripts/test-linux.sh
  test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build and test native viewer
        run: ./scripts/test.sh
      - name: Check shell syntax
        run: bash -n bin/markman scripts/*.sh
